<head>

<style>
  :root{
    --paper:#070707; --ink:#F0EFEA; --ink-2:#A3A19A; --ink-3:#6A6862;
    --hair:#232320; --glass:rgba(255,255,255,.06); --glass-brd:rgba(240,239,234,.16); --accent:#FF5637;
    --sans:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    --padX:40px; --padY:24px;
  }
  /* 4 light stops */
  [data-mode="light"]{--paper:#F5F4F0;--ink:#141310;--ink-2:#4C4A44;--ink-3:#8A887F;--hair:#DEDCD5;--glass:rgba(255,255,255,.55);--glass-brd:rgba(20,19,16,.14);--accent:#E5482B}
  [data-mode="sand"] {--paper:#EBE2D0;--ink:#241B0F;--ink-2:#5E5138;--ink-3:#948467;--hair:#D6CBB4;--glass:rgba(255,255,255,.5);--glass-brd:rgba(36,27,15,.16);--accent:#BE4E22}
  [data-mode="sky"]  {--paper:#E5EAF1;--ink:#111823;--ink-2:#465065;--ink-3:#7C879B;--hair:#D0D7E1;--glass:rgba(255,255,255,.55);--glass-brd:rgba(17,24,35,.14);--accent:#2F6DE0}
  [data-mode="mint"] {--paper:#E2EBE3;--ink:#0F2016;--ink-2:#42574A;--ink-3:#77897C;--hair:#CDDACE;--glass:rgba(255,255,255,.5);--glass-brd:rgba(15,32,22,.15);--accent:#1E8A5A}
  /* 6 dark stops (high-contrast light-on-dark) */
  [data-mode="maroon"]{--paper:#331716;--ink:#FBE0D2;--ink-2:#DBAB99;--ink-3:#9A6B5F;--hair:#4A2624;--glass:rgba(255,255,255,.07);--glass-brd:rgba(251,224,210,.20);--accent:#FF8A5B}
  [data-mode="forest"]{--paper:#142519;--ink:#DCF0D6;--ink-2:#A9C69E;--ink-3:#6E8467;--hair:#22371F;--glass:rgba(255,255,255,.06);--glass-brd:rgba(220,240,214,.20);--accent:#84D66B}
  [data-mode="teal"]  {--paper:#0C2827;--ink:#CDEFE9;--ink-2:#95C3BC;--ink-3:#5F847E;--hair:#193B39;--glass:rgba(255,255,255,.06);--glass-brd:rgba(205,239,233,.20);--accent:#5FD9C6}
  [data-mode="blue"]  {--paper:#111E36;--ink:#D6E4FB;--ink-2:#9FB5DA;--ink-3:#63769A;--hair:#1F3050;--glass:rgba(255,255,255,.06);--glass-brd:rgba(214,228,251,.20);--accent:#6FA8FF}
  [data-mode="violet"]{--paper:#1E1A32;--ink:#E0DBFB;--ink-2:#B0A9DA;--ink-3:#726B9A;--hair:#2E2A46;--glass:rgba(255,255,255,.07);--glass-brd:rgba(224,219,251,.20);--accent:#A79BFF}
  [data-mode="dark"]  {--paper:#070707;--ink:#F0EFEA;--ink-2:#A3A19A;--ink-3:#6A6862;--hair:#232320;--glass:rgba(255,255,255,.06);--glass-brd:rgba(240,239,234,.16);--accent:#FF5637}

  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-weight:400;line-height:1.5;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden;
    transition:background-color .5s ease,color .5s ease;}
  a{color:inherit}

  .atmos{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(120% 90% at 88% 8%, color-mix(in srgb,var(--ink) 6%,transparent), transparent 60%);}

  .grid12{display:grid;grid-template-columns:repeat(12,1fr);gap:24px}

  .grid-overlay{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity .35s ease;padding:0 var(--padX)}
  html.grid-on .grid-overlay{opacity:1}
  .grid-overlay .cols{height:100%}
  .grid-overlay .cols span{background:color-mix(in srgb,var(--ink) 2%,transparent);
    border-left:1px solid color-mix(in srgb,var(--ink) 8%,transparent);
    border-right:1px solid color-mix(in srgb,var(--ink) 8%,transparent)}

  .frame{position:relative;z-index:2;height:100svh;height:100vh;padding:var(--padY) var(--padX);
    display:grid;grid-template-rows:auto 1fr auto auto;gap:24px;}

  /* top row */
  .top{align-items:center}
  .wordmark{grid-column:1 / span 6;font-size:1.02rem;letter-spacing:.02em}
  .wordmark b{font-weight:700;letter-spacing:.04em}
  .wordmark .sep{color:var(--ink-3);font-weight:400;margin:0 4px}
  .wordmark .yr{color:var(--ink-2);font-weight:400}
  .toplinks{grid-column:7 / -1;display:flex;justify-content:flex-end;gap:28px}
  .toplinks a{position:relative;text-decoration:none;font-weight:600;font-size:1rem;display:inline-flex;align-items:baseline;gap:4px;padding:2px 0}
  .toplinks a .ar{font-size:.82em;color:var(--ink-3);transition:transform .3s cubic-bezier(.16,1,.3,1),color .3s}
  .toplinks a::after{content:"";position:absolute;left:0;bottom:-1px;height:1.5px;width:100%;background:var(--ink);
    transform:scaleX(0);transform-origin:left;transition:transform .38s cubic-bezier(.16,1,.3,1)}
  .toplinks a:hover::after,.toplinks a:focus-visible::after{transform:scaleX(1)}
  .toplinks a:hover .ar,.toplinks a:focus-visible .ar{transform:translate(3px,-3px);color:var(--ink)}

  /* hero */
  .hero{grid-column:1 / -1;align-self:center;display:flex;flex-direction:column}
  .badge{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;
    font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--ink);
    background:var(--glass);border:1px solid var(--glass-brd);
    -webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);margin-bottom:16px}
  .live{position:relative;width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
  .live::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--accent);animation:ping 2.6s cubic-bezier(0,0,.2,1) infinite}
  @keyframes ping{0%{transform:scale(1);opacity:.7}70%{transform:scale(3.6);opacity:0}100%{opacity:0}}
  h1{font-weight:700;font-size:clamp(2.4rem,min(15vw,20vh),12rem);line-height:.85;letter-spacing:-.035em;
    text-wrap:balance}
  .line{display:block;overflow:hidden;padding-bottom:.06em}
  .line > span{display:block;will-change:transform}
  .role{font-weight:600;font-size:clamp(1.35rem,2.7vw,2.05rem);letter-spacing:-.014em;margin-top:24px}
  .lede{max-width:100%;color:var(--ink-2);font-size:clamp(.98rem,1.2vw,1.14rem);line-height:1.55;margin-top:12px;min-height:3.1em;text-wrap:balance}
  .lede .lb{white-space:pre}
  @media (min-width:640px){.lede .lb{display:block;height:0;overflow:hidden}}
  .caret{display:inline-block;width:3px;height:1em;background:var(--accent);border-radius:1px;
    vertical-align:-.13em;margin-left:3px;animation:blink 1.05s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  /* footer */
  .foot{align-items:end}
  .foot .loc{grid-column:1 / span 7;font-size:.82rem;color:var(--ink-3);font-weight:500;letter-spacing:.01em}
  .foot .cr{grid-column:8 / -1;text-align:right;font-size:.82rem;color:var(--ink-3);font-weight:500;letter-spacing:.01em}

  a:focus-visible,button:focus-visible,[role=slider]:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:3px}

  /* ---- shared slider look ---- */
  .rail{position:fixed;top:50%;transform:translateY(-50%);z-index:6;display:flex;flex-direction:column;align-items:center;gap:12px}
  .rail-r{right:var(--padX)}
  @media (max-width:640px){.rail{display:none}}

  /* top-center horizontal font slider */
  .fontbar{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:7;height:34px;
    width:clamp(230px,26vw,300px);border-radius:999px;background:var(--glass);border:1px solid var(--glass-brd);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);cursor:pointer;touch-action:none}
  .fontbar .fdots{position:absolute;top:50%;left:17px;right:17px;transform:translateY(-50%);
    display:flex;justify-content:space-between;align-items:center;pointer-events:none}
  .fontbar .fdots i{width:3px;height:3px;border-radius:50%;background:var(--ink-3);opacity:.55}
  .fhandle{position:absolute;top:50%;width:28px;height:28px;border-radius:50%;transform:translate(-50%,-50%);
    background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 10px rgba(0,0,0,.3);transition:left .3s cubic-bezier(.16,1,.3,1),background .4s,color .4s;pointer-events:none}
  .fhandle .aa{font-family:var(--sans);font-weight:700;font-size:12px;line-height:1;letter-spacing:-.02em}
  @media (max-width:899px){.fontbar{display:none}}
  .slider{position:relative;width:36px;height:min(250px,44vh);border-radius:999px;background:var(--glass);
    border:1px solid var(--glass-brd);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);cursor:pointer;touch-action:none}
  .slider .dots{position:absolute;left:50%;top:16px;bottom:16px;transform:translateX(-50%);
    display:flex;flex-direction:column;justify-content:space-between;align-items:center;pointer-events:none}
  .slider .dots i{width:3px;height:3px;border-radius:50%;background:var(--ink-3);opacity:.55}
  .handle{position:absolute;left:50%;width:28px;height:28px;border-radius:50%;transform:translate(-50%,-50%);
    background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 10px rgba(0,0,0,.3);transition:top .32s cubic-bezier(.16,1,.3,1),background .4s,color .4s;pointer-events:none}
  .handle svg{width:15px;height:15px;display:block}
  .handle .aa{font-family:var(--sans);font-weight:700;font-size:12px;line-height:1;letter-spacing:-.02em}
  .gridbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--glass-brd);background:var(--glass);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--ink-2);cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:color .3s,border-color .3s}
  .gridbtn:hover{color:var(--ink)}
  html.grid-on .gridbtn{color:var(--ink);border-color:color-mix(in srgb,var(--ink) 45%,transparent)}
  .gridbtn svg{width:15px;height:15px}

  /* mobile control bar (theme slider + grid toggle), above footer */
  .mobilebar{display:none;grid-column:1 / -1;align-items:center;justify-content:center;gap:12px;padding-top:4px}
  @media (max-width:640px){.mobilebar{display:flex}}
  .mslider{position:relative;width:min(280px,68vw);height:34px;border-radius:999px;background:var(--glass);
    border:1px solid var(--glass-brd);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);cursor:pointer;touch-action:none}
  .mslider .dots{position:absolute;top:50%;left:16px;right:16px;transform:translateY(-50%);
    display:flex;justify-content:space-between;align-items:center;pointer-events:none}
  .mslider .dots i{width:3px;height:3px;border-radius:50%;background:var(--ink-3);opacity:.55}
  .mhandle{position:absolute;top:50%;width:28px;height:28px;border-radius:50%;transform:translate(-50%,-50%);
    background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 10px rgba(0,0,0,.3);transition:left .32s cubic-bezier(.16,1,.3,1),background .4s,color .4s;pointer-events:none}
  .mhandle svg{width:15px;height:15px;display:block}
  @media (max-width:480px){
    .wordmark .sep,.wordmark .yr{display:none}
    .toplinks{gap:18px}
    .toplinks a{font-size:.92rem}
  }

  /* custom cursor */
  .cursor{position:fixed;top:0;left:0;z-index:50;pointer-events:none;width:11px;height:11px;border-radius:50%;
    background:#fff;mix-blend-mode:difference;transform:translate(-50%,-50%);
    transition:width .28s cubic-bezier(.16,1,.3,1),height .28s cubic-bezier(.16,1,.3,1);opacity:0}
  .cursor.on{opacity:1}.cursor.hover{width:44px;height:44px}
  @media (hover:none),(pointer:coarse){.cursor{display:none}}

  /* reveal */
  .anim .line > span{transform:translateY(105%)}
  .anim .fade{opacity:0;transform:translateY(9px)}
  .anim.ready .line > span{transform:translateY(0);transition:transform .95s cubic-bezier(.16,1,.3,1) var(--d,0s)}
  .anim.ready .fade{opacity:1;transform:none;transition:opacity .7s ease var(--d,0s),transform .7s cubic-bezier(.16,1,.3,1) var(--d,0s)}
  @media (prefers-reduced-motion:reduce){.live::after{animation:none}.caret{animation:none;opacity:0}.cursor{display:none}body,.handle{transition:none}}
</style>
</head>
<body>
  <div class="atmos" aria-hidden="true"></div>

  <!-- top-center font slider -->

  </main>

<script>
(function(){
  var root=document.documentElement;
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  root.classList.add('js'); if(!reduce) root.classList.add('anim');

  /* ---- pixel-perfect optical left-alignment of the name to the grid line ---- */
  var _ac=document.createElement('canvas'),_actx=_ac.getContext('2d');
  function alignH1(){
    var h1=document.querySelector('h1'); if(!h1) return;
    var cs=getComputedStyle(h1), size=parseFloat(cs.fontSize), weight=cs.fontWeight, fam=cs.fontFamily;
    _actx.textAlign='left'; _actx.textBaseline='alphabetic';
    document.querySelectorAll('h1 .line').forEach(function(ln){
      var txt=(ln.textContent||'').trim(); if(!txt) return;
      _actx.font=weight+' '+size+'px '+fam;
      var m=_actx.measureText(txt);
      // left side bearing = distance from pen origin to the leftmost ink; shift left by it
      var lsb=(typeof m.actualBoundingBoxLeft==='number')? -m.actualBoundingBoxLeft : 0;
      ln.style.marginLeft=(-lsb).toFixed(2)+'px';
    });
  }

  /* ---- theme slider ---- */
  var THEMES=[{id:'light',dark:false},{id:'sand',dark:false},{id:'sky',dark:false},{id:'mint',dark:false},{id:'maroon',dark:true},{id:'forest',dark:true},{id:'teal',dark:true},{id:'blue',dark:true},{id:'violet',dark:true},{id:'dark',dark:true}];
  var SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2M12 19.4v2M4.6 4.6l1.5 1.5M17.9 17.9l1.5 1.5M2.6 12h2M19.4 12h2M4.6 19.4l1.5-1.5M17.9 6.1l1.5-1.5"/></svg>';
  var MOON='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.6 2.6A9 9 0 1 0 21.4 15 7.2 7.2 0 0 1 15.6 2.6z"/></svg>';
  var tSlider=document.getElementById('slider'),tHandle=document.getElementById('handle'),
      mSlider=document.getElementById('mslider'),mHandle=document.getElementById('mhandle'),tCur=9,tN=THEMES.length;
  function tPlace(i){var f=i/(tN-1);
    if(tHandle){var ins=16,h=tSlider.clientHeight,u=h-ins*2;tHandle.style.top=(ins+u*f)+'px';}
    if(mHandle&&mSlider){var i2=16,w=mSlider.clientWidth,u2=w-i2*2;mHandle.style.left=(i2+u2*f)+'px';}}
  function tApply(i,store){tCur=i;var t=THEMES[i],ic=t.dark?MOON:SUN;root.setAttribute('data-mode',t.id);
    if(tHandle)tHandle.innerHTML=ic; if(mHandle)mHandle.innerHTML=ic;
    tSlider.setAttribute('aria-valuenow',String(i+1));tSlider.setAttribute('aria-valuetext',t.id);
    if(mSlider){mSlider.setAttribute('aria-valuenow',String(i+1));mSlider.setAttribute('aria-valuetext',t.id);}
    tPlace(i);
    if(store!==false){try{localStorage.setItem('ob-theme',t.id);}catch(e){}}}
  function tFromY(y){var r=tSlider.getBoundingClientRect(),ins=16,u=r.height-ins*2;return Math.round(Math.max(0,Math.min(1,(y-r.top-ins)/u))*(tN-1));}
  function tFromX(x){var r=mSlider.getBoundingClientRect(),ins=16,u=r.width-ins*2;return Math.round(Math.max(0,Math.min(1,(x-r.left-ins)/u))*(tN-1));}
  var tDrag=false;
  tSlider.addEventListener('pointerdown',function(e){tDrag=true;tSlider.setPointerCapture(e.pointerId);tApply(tFromY(e.clientY));});
  tSlider.addEventListener('pointermove',function(e){if(tDrag)tApply(tFromY(e.clientY));});
  tSlider.addEventListener('pointerup',function(){tDrag=false;});
  tSlider.addEventListener('keydown',function(e){if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();tApply(Math.max(0,tCur-1));}else if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();tApply(Math.min(tN-1,tCur+1));}});
  if(mSlider){var mDrag=false;
    mSlider.addEventListener('pointerdown',function(e){mDrag=true;mSlider.setPointerCapture(e.pointerId);tApply(tFromX(e.clientX));});
    mSlider.addEventListener('pointermove',function(e){if(mDrag)tApply(tFromX(e.clientX));});
    mSlider.addEventListener('pointerup',function(){mDrag=false;});
    mSlider.addEventListener('keydown',function(e){if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();tApply(Math.max(0,tCur-1));}else if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();tApply(Math.min(tN-1,tCur+1));}});}

  /* ---- font slider ---- */
  var FONTS=[
    {id:'inter',label:'Inter',stack:'"Inter"'},
    {id:'hanken',label:'Hanken Grotesk',stack:'"Hanken Grotesk"'},
    {id:'instrument',label:'Instrument Sans',stack:'"Instrument Sans"'},
    {id:'manrope',label:'Manrope',stack:'"Manrope"'},
    {id:'schibsted',label:'Schibsted Grotesk',stack:'"Schibsted Grotesk"'},
    {id:'onest',label:'Onest',stack:'"Onest"'}
  ];
  var FB=',ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif';
  var fSlider=document.getElementById('fslider'),fHandle=document.getElementById('fhandle'),fCur=0,fN=FONTS.length;
  function fPlace(i){var ins=16,w=fSlider.clientWidth,u=w-ins*2;fHandle.style.left=(ins+u*(i/(fN-1)))+'px';}
  function fApply(i,store){fCur=i;var f=FONTS[i];root.style.setProperty('--sans',f.stack+FB);
    fSlider.setAttribute('aria-valuenow',String(i+1));fSlider.setAttribute('aria-valuetext',f.label);fPlace(i);
    if(document.fonts&&document.fonts.ready){document.fonts.ready.then(alignH1);}else{alignH1();}
    if(store!==false){try{localStorage.setItem('ob-font',f.id);}catch(e){}}}
  function fFromX(x){var r=fSlider.getBoundingClientRect(),ins=16,u=r.width-ins*2;return Math.round(Math.max(0,Math.min(1,(x-r.left-ins)/u))*(fN-1));}
  var fDrag=false;
  fSlider.addEventListener('pointerdown',function(e){fDrag=true;fSlider.setPointerCapture(e.pointerId);fApply(fFromX(e.clientX));});
  fSlider.addEventListener('pointermove',function(e){if(fDrag)fApply(fFromX(e.clientX));});
  fSlider.addEventListener('pointerup',function(){fDrag=false;});
  fSlider.addEventListener('keydown',function(e){if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();fApply(Math.max(0,fCur-1));}else if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();fApply(Math.min(fN-1,fCur+1));}});

  window.addEventListener('resize',function(){tPlace(tCur);fPlace(fCur);alignH1();});
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(alignH1);}

  var ts=9;try{var s=localStorage.getItem('ob-theme');if(s)for(var i=0;i<tN;i++)if(THEMES[i].id===s)ts=i;}catch(e){}
  tApply(ts,false);
  var fs=0;try{var g=localStorage.getItem('ob-font');if(g)for(var j=0;j<fN;j++)if(FONTS[j].id===g)fs=j;}catch(e){}
  fApply(fs,false);

  /* grid toggle */
  var gb=document.getElementById('gridbtn'),mgb=document.getElementById('mgridbtn');
  function toggleGrid(){var on=root.classList.toggle('grid-on');var v=on?'true':'false';
    if(gb)gb.setAttribute('aria-pressed',v);if(mgb)mgb.setAttribute('aria-pressed',v);}
  if(gb)gb.addEventListener('click',toggleGrid);
  if(mgb)mgb.addEventListener('click',toggleGrid);

  /* intro reveal + streaming (two lines) */
  function startAnim(){
    var lede=document.querySelector('.lede'),out=lede.querySelector('.stream-out'),caret=lede.querySelector('.caret'),full=lede.getAttribute('data-stream')||'';
    lede.setAttribute('aria-label',full.replace(/\n/g,' '));
    function render(n){out.innerHTML=full.slice(0,n).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\n/g,'<i class="lb"> </i>');}
    if(reduce){render(full.length);requestAnimationFrame(function(){root.classList.add('ready');});return;}
    requestAnimationFrame(function(){requestAnimationFrame(function(){root.classList.add('ready');});});
    var i=0;setTimeout(function type(){if(i<=full.length){render(i);i++;var ch=full.charAt(i-2);setTimeout(type,(ch===','||ch==='.'||ch==='\n')?90:7+Math.random()*9);}else if(caret){setTimeout(function(){caret.style.animation='none';caret.style.transition='opacity .55s ease';caret.style.opacity='0';},1150);}},600);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',startAnim);else startAnim();

  /* cursor + magnetic */
  var fine=window.matchMedia&&matchMedia('(hover:hover) and (pointer:fine)').matches;
  if(fine&&!reduce){
    var c=document.querySelector('.cursor'),cx=innerWidth/2,cy=innerHeight/2,x=cx,y=cy,shown=false;
    addEventListener('mousemove',function(e){cx=e.clientX;cy=e.clientY;if(!shown){shown=true;c.classList.add('on');}},{passive:true});
    (function loop(){x+=(cx-x)*.2;y+=(cy-y)*.2;c.style.transform='translate('+x+'px,'+y+'px) translate(-50%,-50%)';requestAnimationFrame(loop);})();
    document.querySelectorAll('[data-cursor]').forEach(function(el){el.addEventListener('mouseenter',function(){c.classList.add('hover');});el.addEventListener('mouseleave',function(){c.classList.remove('hover');});});
    document.querySelectorAll('.magnetic').forEach(function(el){
      el.addEventListener('mousemove',function(e){var r=el.getBoundingClientRect();el.style.transform='translate('+(e.clientX-(r.left+r.width/2))*.28+'px,'+(e.clientY-(r.top+r.height/2))*.34+'px)';});
      el.addEventListener('mouseleave',function(){el.style.transform='';el.style.transition='transform .5s cubic-bezier(.16,1,.3,1)';setTimeout(function(){el.style.transition='';},520);});});
  }
})();
</script>
</body>
</html>
